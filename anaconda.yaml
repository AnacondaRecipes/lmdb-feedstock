anaconda_config_version: 1
upstream_sources:
  - github:
      identifier: LMDB/lmdb
      use_max_tag: true
      include_regex: ^LMDB_[0-9][0-9.]*$
      prefix: LMDB_
      exclude_regex: (?i)^(?=.*(?:(?<=\d)rc\d*|(?<=\d)dev\d+|(?:^|[-._])(?:alpha|beta|gamma|pre|preview)(?:\d+)?|[-._]rc\d+|(?:^|[-._])dev\d+|(?:\d+\.)+\d+[ab]\d*)).+$
      from_pattern: ^v?(\d+(?:\.\d+)*.*)$
      to_pattern: \1
